<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Sekolah</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #e2e8f0 0%, #f8fafc 100%); color: #334155; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background-color: #ffffff; max-width: 420px; width: 100%; padding: 35px 25px; border-radius: 24px; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.15); }
        h2 { text-align: center; color: #1e293b; font-weight: 700; margin-bottom: 20px; font-size: 24px; }
        label { font-weight: 600; font-size: 13px; color: #64748b; margin-bottom: 6px; display: block; }
        
        select, input { width: 100%; padding: 14px 16px; margin-bottom: 20px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-size: 14px; color: #334155; background-color: #f8fafc; transition: all 0.3s ease; outline: none; }
        select:focus, input:focus { border-color: #3b82f6; background-color: #ffffff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3); }
        .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-danger { background-color: #fee2e2; color: #ef4444; margin-top: 15px; border: 1.5px solid #fca5a5; }
        .btn-danger:hover { background-color: #fecaca; }

        /* === UI DASHBOARD BARU === */
        .dash-card { background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: none; }
        .dash-title { font-size: 12px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;}
        .dash-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
        .dash-label { color: #475569; font-weight: 500;}
        .dash-val { font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 8px;}
        .badge { padding: 4px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-gray { background: #f1f5f9; color: #64748b; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; text-align: center; background: #f8fafc; padding: 12px; border-radius: 12px;}
        .stat-num { font-size: 18px; font-weight: 700; color: #2563eb; line-height: 1.2; }
        .stat-text { font-size: 10px; color: #64748b; font-weight: 600; text-transform: uppercase; margin-top: 4px;}

        #kamera-container { position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: #0f172a; margin-bottom: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        #video { width: 100%; display: block; transform: scaleX(-1); }
        #canvas { display: none; }
        #preview { width: 100%; display: none; border-radius: 16px; margin-bottom: 15px; border: 3px solid #3b82f6; transform: scaleX(-1); }
        .msg { text-align: center; font-weight: 500; font-size: 13px; margin-bottom: 15px; line-height: 1.5; padding: 12px; border-radius: 12px;}
        .msg-error { color: #ef4444; background-color: #fef2f2; border: 1px solid #fecaca; }
        .msg-success { color: #059669; background-color: #ecfdf5; border: 1px solid #a7f3d0; }
        .msg-warning { color: #d97706; background-color: #fffbeb; border: 1px solid #fde68a; }
        .info-time { font-size: 14px; color: #b91c1c; display: block; margin-top: 10px; background: #fef2f2; padding: 10px; border-radius: 8px; font-weight: 600; border-left: 4px solid #ef4444; }
        #panel-absen { display: none; }
        .header-profil { background: #f8fafc; padding: 12px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 1px solid #e2e8f0; }
        .nama-guru { font-size: 16px; color: #2563eb; font-weight: 700; display: block; }
        hr { border: 0; height: 1px; background: #e2e8f0; margin: 25px 0; }
        .link-text { color: #3b82f6; text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.3s; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ================= PANEL LOGIN ================= -->
    <div id="panel-login">
        <h2>👋 Selamat Datang</h2>
        <p style="text-align: center; color: #64748b; font-size: 13px; margin-bottom: 20px; margin-top:-10px;">Silakan login ke portal absensi</p>
        
        <div id="login-msg" class="msg" style="display:none;"></div>
        
        <label>Alamat Email</label>
        <input type="email" id="email" placeholder="contoh: aanfarhan@gmail.com" required>
        
        <label>Kata Sandi</label>
        <input type="password" id="password" placeholder="Masukkan password Anda" required>
        
        <button id="btnLogin" class="btn-primary" onclick="prosesLogin()">Masuk Sistem</button>
        
        <div style="text-align: center; margin-top: 15px;">
            <a href="#" onclick="tampilRegister()" class="link-text">Belum punya akun? Daftar di sini</a>
        </div>
    </div>

    <!-- ================= PANEL REGISTER ================= -->
    <div id="panel-register" style="display: none;">
        <h2>📝 Daftar Akun</h2>
        <p style="text-align: center; color: #64748b; font-size: 13px; margin-bottom: 20px; margin-top:-10px;">Buat akun untuk presensi</p>
        
        <div id="register-msg" class="msg" style="display:none;"></div>
        
        <label>Nama Lengkap</label>
        <input type="text" id="reg-nama" placeholder="Contoh: Muhammad Farhan Sidiq" required>
        
        <label>Alamat Email</label>
        <input type="email" id="reg-email" placeholder="Masukkan email aktif" required>
        
        <label>Kata Sandi</label>
        <input type="password" id="reg-password" placeholder="Buat password" required>
        
        <button id="btnRegister" class="btn-primary" onclick="prosesRegister()">Daftar Sekarang</button>
        
        <div style="text-align: center; margin-top: 15px;">
            <a href="#" onclick="tampilLogin()" class="link-text">Sudah punya akun? Login di sini</a>
        </div>
    </div>

    <!-- ================= PANEL ABSEN ================= -->
    <div id="panel-absen">
        <h2>📍 Form Absensi</h2>
        
        <div class="header-profil">
            <span style="font-size: 12px; color: #64748b;">Pegawai Aktif:</span>
            <span id="nama-pegawai" class="nama-guru"></span>
        </div>

        <!-- DASHBOARD REKAP -->
        <div id="dashboard-ui" class="dash-card">
            <div class="dash-title">📅 Rekap Hari Ini & Akumulasi</div>
            
            <div class="dash-row">
                <span class="dash-label">Masuk:</span>
                <span class="dash-val">
                    <span id="dash-masuk-jam">-</span>
                    <span id="dash-masuk-ket" class="badge badge-gray">-</span>
                </span>
            </div>
            
            <div class="dash-row">
                <span class="dash-label">Pulang:</span>
                <span class="dash-val">
                    <span id="dash-pulang-jam">-</span>
                    <span id="dash-pulang-ket" class="badge badge-gray">-</span>
                </span>
            </div>

            <div class="stat-grid">
                <div>
                    <div class="stat-num" id="stat-hadir">0</div>
                    <div class="stat-text">Total Hadir</div>
                </div>
                <div>
                    <div class="stat-num" id="stat-telat" style="color: #ea580c;">0</div>
                    <div class="stat-text">Jml Telat</div>
                </div>
                <div>
                    <div class="stat-num" id="stat-awal" style="color: #e11d48;">0</div>
                    <div class="stat-text">Plg Cepat</div>
                </div>
            </div>
        </div>

        <label>Status Kehadiran</label>
        <select id="status">
            <option value="Hadir">🟢 Hadir (Datang)</option>
            <option value="Pulang">🔴 Pulang</option>
        </select>
        
        <label>Verifikasi Wajah (Selfie)</label>
        <div id="kamera-container">
            <video id="video" autoplay playsinline></video>
        </div>
        <canvas id="canvas"></canvas>
        <img id="preview" alt="Hasil Foto">
        
        <button id="btnJepret" type="button" class="btn-primary" onclick="ambilFoto()">📸 Jepret Foto</button>
        <button id="btnUlangi" type="button" class="btn-warning" style="display:none;" onclick="ulangiFoto()">🔄 Ulangi Foto</button>
        
        <hr>
        
        <button id="btnAbsen" class="btn-primary" onclick="kirimAbsen()">🚀 Kirim Absen & Lokasi</button>
        <button class="btn-danger" onclick="logout()">Keluar Akun</button>
        
        <div id="absen-msg" class="msg" style="display:none; margin-top: 20px;"></div>
    </div>

</div>

<script>
    // MASUKKAN URL WEB APP ANDA DI SINI
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxEbbLLq8Z1-ow_kUhwvW_5himrBrZvFua_pzIW4-TJG4Tx4JpXSAj8kqSjlqW9GDwm/exec'; 
    //const SEKOLAH_LAT = -6.200000; 
    //const SEKOLAH_LNG = 106.816666; 
    const SEKOLAH_LAT = -6.261640528659523;
    const SEKOLAH_LNG = 106.84234964377927;
    const RADIUS_MAKSIMAL = 50; 

    let base64String = "";
    let streamKamera = null;

    window.onload = function() {
        const sesiNama = localStorage.getItem("guru_nama");
        if (sesiNama) {
            document.getElementById("nama-pegawai").innerText = sesiNama;
            document.getElementById("panel-login").style.display = "none";
            document.getElementById("panel-register").style.display = "none";
            document.getElementById("panel-absen").style.display = "block";
            
            renderDashboard();
            cekStatusHarian(); 
        }
    };

    function showMsg(elId, text, type) {
        const el = document.getElementById(elId);
        el.style.display = "block"; el.className = "msg msg-" + type; el.innerHTML = text;
    }

    function tampilRegister() { document.getElementById("panel-login").style.display = "none"; document.getElementById("panel-register").style.display = "block"; }
    function tampilLogin() { document.getElementById("panel-register").style.display = "none"; document.getElementById("panel-login").style.display = "block"; }

    // --- RENDER DASHBOARD ---
    function renderDashboard() {
        const statsStr = localStorage.getItem("guru_stats");
        if(!statsStr) return;
        const stats = JSON.parse(statsStr);

        document.getElementById("dashboard-ui").style.display = "block";
        document.getElementById("dash-masuk-jam").innerText = stats.waktuMasuk;
        document.getElementById("dash-pulang-jam").innerText = stats.waktuPulang;

        function setBadge(elId, val) {
            const el = document.getElementById(elId);
            el.innerText = val;
            if(val === "-") { el.className = "badge badge-gray"; }
            else if(val.toLowerCase().includes("telat") || val.toLowerCase().includes("awal")) { el.className = "badge badge-red"; }
            else { el.className = "badge badge-green"; }
        }

        setBadge("dash-masuk-ket", stats.ketMasuk);
        setBadge("dash-pulang-ket", stats.ketPulang);

        document.getElementById("stat-hadir").innerText = stats.totalHadir;
        document.getElementById("stat-telat").innerText = stats.totalTelat;
        document.getElementById("stat-awal").innerText = stats.totalPulangAwal;
    }

    // --- PENGUNCIAN FORM HARIAN ---
    function cekStatusHarian() {
        const statsStr = localStorage.getItem("guru_stats");
        if(!statsStr) { mulaiKamera(); return; }
        const stats = JSON.parse(statsStr);

        const selStatus = document.getElementById("status");
        const btnJepret = document.getElementById("btnJepret");
        const btnAbsen = document.getElementById("btnAbsen");
        const wadahKamera = document.getElementById("kamera-container");

        selStatus.disabled = false; selStatus.options[0].disabled = false;
        btnJepret.style.display = "block"; btnAbsen.style.display = "block"; wadahKamera.style.display = "block";

        if (stats.statusHariIni === "Hadir") {
            selStatus.value = "Pulang"; selStatus.options[0].disabled = true; 
            showMsg("absen-msg", "Info: Anda sudah absen masuk. Silakan lakukan absen Pulang jika sudah waktunya.", "warning");
            mulaiKamera();
        } else if (stats.statusHariIni === "Pulang") {
            selStatus.disabled = true; btnJepret.style.display = "none"; btnAbsen.style.display = "none"; wadahKamera.style.display = "none";
            showMsg("absen-msg", "🎉 Anda sudah menyelesaikan absen hari ini. Sampai jumpa besok!", "success");
            matikanKamera();
        } else {
            selStatus.value = "Hadir"; mulaiKamera();
        }
    }

    function prosesRegister() {
        const nama = document.getElementById("reg-nama").value;
        const email = document.getElementById("reg-email").value;
        const password = document.getElementById("reg-password").value;
        const btnReg = document.getElementById("btnRegister");
        if (!nama || !email || !password) { showMsg("register-msg", "Mohon lengkapi semua data!", "error"); return; }

        btnReg.disabled = true; showMsg("register-msg", "Mendaftarkan akun...", "warning");
        fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "register", nama: nama, email: email, password: password }) })
        .then(res => res.json()).then(data => {
            if (data.result === "success") {
                showMsg("register-msg", "✅ Berhasil! Mengalihkan ke halaman login...", "success"); 
                document.getElementById("reg-nama").value = ""; document.getElementById("reg-email").value = ""; document.getElementById("reg-password").value = "";
                btnReg.disabled = false; setTimeout(tampilLogin, 2000); 
            } else { showMsg("register-msg", data.message, "error"); btnReg.disabled = false; }
        }).catch(err => { showMsg("register-msg", "Kesalahan jaringan.", "error"); btnReg.disabled = false; });
    }

    async function mulaiKamera() {
        const video = document.getElementById('video');
        try { streamKamera = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }); video.srcObject = streamKamera; } 
        catch (err) { console.log("Kamera tidak diperlukan atau ditolak."); }
    }

    function ambilFoto() {
        const video = document.getElementById('video'); const canvas = document.getElementById('canvas'); const preview = document.getElementById('preview');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        base64String = canvas.toDataURL('image/jpeg', 0.7);
        preview.src = base64String; preview.style.display = 'block';
        document.getElementById('kamera-container').style.display = 'none';
        document.getElementById('btnJepret').style.display = 'none'; document.getElementById('btnUlangi').style.display = 'block';
    }

    function ulangiFoto() {
        base64String = ""; document.getElementById('preview').style.display = 'none';
        document.getElementById('kamera-container').style.display = 'block';
        document.getElementById('btnJepret').style.display = 'block'; document.getElementById('btnUlangi').style.display = 'none';
    }

    function matikanKamera() { if (streamKamera) { streamKamera.getTracks().forEach(track => track.stop()); } }

    function prosesLogin() {
        const email = document.getElementById("email").value; const password = document.getElementById("password").value; const btnLogin = document.getElementById("btnLogin");
        if (!email || !password) { showMsg("login-msg", "Mohon isi email dan password!", "error"); return; }
        btnLogin.disabled = true; showMsg("login-msg", "Memeriksa kredensial...", "warning");

        fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "login", email: email, password: password }) })
        .then(res => res.json()).then(data => {
            if (data.result === "success") {
                localStorage.setItem("guru_nama", data.nama);
                
                // Simpan Data Dashboard ke Memori HP
                localStorage.setItem("guru_stats", JSON.stringify(data.stats));

                document.getElementById("nama-pegawai").innerText = data.nama;
                document.getElementById("panel-login").style.display = "none"; document.getElementById("panel-absen").style.display = "block";
                document.getElementById("email").value = ""; document.getElementById("password").value = ""; document.getElementById("login-msg").style.display = "none";
                btnLogin.disabled = false;
                
                renderDashboard();
                cekStatusHarian(); 
            } else { showMsg("login-msg", data.message, "error"); btnLogin.disabled = false; }
        }).catch(err => { showMsg("login-msg", "Kesalahan jaringan.", "error"); btnLogin.disabled = false; });
    }

    function logout() {
        matikanKamera(); localStorage.removeItem("guru_nama"); localStorage.removeItem("guru_stats");
        document.getElementById("panel-absen").style.display = "none"; document.getElementById("panel-login").style.display = "block";
        document.getElementById("absen-msg").style.display = "none"; document.getElementById("dashboard-ui").style.display = "none";
        ulangiFoto(); 
    }

    function hitungJarakMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
    }

    function kirimAbsen() {
        const nama = localStorage.getItem("guru_nama"); const status = document.getElementById('status').value; const btnAbsen = document.getElementById('btnAbsen');
        if (!nama) { alert("Sesi habis."); logout(); return; }
        if (!base64String) { showMsg("absen-msg", "⚠️ Silakan klik 'Jepret Foto' terlebih dahulu!", "error"); return; }
        btnAbsen.disabled = true; showMsg("absen-msg", "Mengecek lokasi GPS...", "warning");

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude; const lng = position.coords.longitude;
                    const jarak = hitungJarakMeters(SEKOLAH_LAT, SEKOLAH_LNG, lat, lng);
                    if (jarak > RADIUS_MAKSIMAL) { showMsg("absen-msg", `❌ <b>Ditolak!</b> Jarak Anda ${jarak}m.<br>(Batas: ${RADIUS_MAKSIMAL}m)`, "error"); btnAbsen.disabled = false; return; }

                    showMsg("absen-msg", `Lokasi aman (${jarak}m). Mengirim data...`, "warning");

                    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "absen", nama: nama, status: status, lat: lat, lng: lng, fotoBase64: base64String }) })
                    .then(res => res.json()).then(data => {
                        if (data.result === "success") {
                            showMsg("absen-msg", `✅ <b>Absen Berhasil!</b><br><span class="info-time">Info: <b>${data.infoWaktu}</b></span>`, "success");
                            
                            // Update Data Dashboard dari balasan Server
                            localStorage.setItem("guru_stats", JSON.stringify(data.stats));
                            
                            ulangiFoto(); btnAbsen.disabled = false;
                            renderDashboard(); setTimeout(cekStatusHarian, 2500); 

                        } else { showMsg("absen-msg", "❌ Gagal: " + data.message, "error"); btnAbsen.disabled = false; }
                    }).catch(err => { showMsg("absen-msg", "❌ <b>Koneksi terputus!</b><br>Coba refresh halaman.", "error"); btnAbsen.disabled = false; });
                },
                function(error) { showMsg("absen-msg", "❌ Gagal akses GPS.", "error"); btnAbsen.disabled = false; }, { enableHighAccuracy: true }
            );
        } else { showMsg("absen-msg", "Browser tidak dukung GPS.", "error"); btnAbsen.disabled = false; }
    }
</script>
</body>
</html>
