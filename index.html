<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Sekolah</title>
    
    <!-- Import Font Modern dari Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* === RESET & GLOBAL === */
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        body { 
            background: linear-gradient(135deg, #e2e8f0 0%, #f8fafc 100%); 
            color: #334155; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        /* === CONTAINER KARTU === */
        .container { 
            background-color: #ffffff; 
            max-width: 420px; 
            width: 100%; 
            padding: 35px 25px; 
            border-radius: 24px; 
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.15); 
        }

        /* === TYPOGRAPHY === */
        h2 { text-align: center; color: #1e293b; font-weight: 700; margin-bottom: 20px; font-size: 24px; }
        label { font-weight: 600; font-size: 13px; color: #64748b; margin-bottom: 6px; display: block; }
        
        /* === INPUT & SELECT === */
        select, input { 
            width: 100%; 
            padding: 14px 16px; 
            margin-bottom: 20px; 
            border-radius: 12px; 
            border: 1.5px solid #e2e8f0; 
            font-size: 14px; 
            color: #334155;
            background-color: #f8fafc;
            transition: all 0.3s ease;
            outline: none;
        }
        select:focus, input:focus { border-color: #3b82f6; background-color: #ffffff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

        /* === TOMBOL (BUTTONS) === */
        button { 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            border: none; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3); }
        .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-warning:hover { background-color: #d97706; }
        
        .btn-danger { background-color: #fee2e2; color: #ef4444; margin-top: 15px; border: 1.5px solid #fca5a5; }
        .btn-danger:hover { background-color: #fecaca; }

        /* === KAMERA LIVES === */
        #kamera-container { 
            position: relative; 
            width: 100%; 
            border-radius: 16px; 
            overflow: hidden; 
            background: #0f172a; 
            margin-bottom: 15px; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        #video { width: 100%; display: block; transform: scaleX(-1); /* Efek Cermin untuk Selfie */ }
        #canvas { display: none; }
        #preview { width: 100%; display: none; border-radius: 16px; margin-bottom: 15px; border: 3px solid #3b82f6; transform: scaleX(-1); }

        /* === MESSAGES & NOTIF === */
        .msg { text-align: center; font-weight: 500; font-size: 14px; margin-bottom: 15px; line-height: 1.5; padding: 10px; border-radius: 8px;}
        .msg-error { color: #ef4444; background-color: #fef2f2; border: 1px solid #fecaca; }
        .msg-success { color: #059669; background-color: #ecfdf5; border: 1px solid #a7f3d0; }
        .msg-warning { color: #d97706; background-color: #fffbeb; border: 1px solid #fde68a; }
        
        .info-time { font-size: 15px; color: #b91c1c; display: block; margin-top: 10px; background: #fef2f2; padding: 12px; border-radius: 8px; font-weight: 600; border-left: 4px solid #ef4444; }

        /* === PANELS === */
        #panel-absen { display: none; }
        .header-profil { background: #f1f5f9; padding: 15px; border-radius: 12px; margin-bottom: 25px; text-align: center; border: 1px solid #e2e8f0; }
        .nama-guru { font-size: 18px; color: #2563eb; font-weight: 700; margin-top: 5px; display: block; }
        
        hr { border: 0; height: 1px; background: #e2e8f0; margin: 25px 0; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ================= PANEL LOGIN ================= -->
    <div id="panel-login">
        <h2>👋 Selamat Datang</h2>
        <p style="text-align: center; color: #64748b; font-size: 13px; margin-bottom: 20px; margin-top:-10px;">Silakan login ke portal absensi</p>
        
        <div id="login-msg" class="msg" style="display:none;"></div>
        
        <label>Alamat Email</label>
        <input type="email" id="email" placeholder="contoh: guru@sekolah.id" required>
        
        <label>Kata Sandi</label>
        <input type="password" id="password" placeholder="Masukkan password Anda" required>
        
        <button id="btnLogin" class="btn-primary" onclick="prosesLogin()">Masuk Sistem</button>
    </div>

    <!-- ================= PANEL ABSEN ================= -->
    <div id="panel-absen">
        <h2>📍 Form Absensi</h2>
        
        <div class="header-profil">
            <span style="font-size: 13px; color: #64748b;">Masuk sebagai:</span>
            <span id="nama-pegawai" class="nama-guru"></span>
        </div>

        <label>Status Kehadiran</label>
        <select id="status">
            <option value="Hadir">🟢 Hadir (Datang)</option>
            <option value="Pulang">🔴 Pulang</option>
        </select>
        
        <label>Verifikasi Wajah (Selfie)</label>
        <!-- Wadah Kamera Langsung -->
        <div id="kamera-container">
            <video id="video" autoplay playsinline></video>
        </div>
        <canvas id="canvas"></canvas>
        <img id="preview" alt="Hasil Foto">
        
        <button id="btnJepret" type="button" class="btn-primary" onclick="ambilFoto()">📸 Jepret Foto</button>
        <button id="btnUlangi" type="button" class="btn-warning" style="display:none;" onclick="ulangiFoto()">🔄 Ulangi Foto</button>
        
        <hr>
        
        <button id="btnAbsen" class="btn-primary" onclick="kirimAbsen()">🚀 Kirim Absen & Lokasi</button>
        <button class="btn-danger" onclick="logout()">Keluar Akun</button>
        
        <div id="absen-msg" class="msg" style="display:none; margin-top: 20px;"></div>
    </div>

</div>

<!-- SCRIPT LOGIKA TETAP SAMA 
 -->
<script>
    // MASUKKAN URL WEB APP ANDA DI SINI
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxEbbLLq8Z1-ow_kUhwvW_5himrBrZvFua_pzIW4-TJG4Tx4JpXSAj8kqSjlqW9GDwm/exec'; 
    
    //const SEKOLAH_LAT = -6.261660060621071; 
    //const SEKOLAH_LNG = 106.84235258398554; 
    //const RADIUS_MAKSIMAL = 50; 

    const SEKOLAH_LAT = -6.331541;
    const SEKOLAH_LNG = 106.821780; 
    const RADIUS_MAKSIMAL = 50; 

    let base64String = "";
    let streamKamera = null;

    window.onload = function() {
        const sesiNama = localStorage.getItem("guru_nama");
        if (sesiNama) {
            document.getElementById("nama-pegawai").innerText = sesiNama;
            document.getElementById("panel-login").style.display = "none";
            document.getElementById("panel-absen").style.display = "block";
            mulaiKamera(); 
        }
    };

    async function mulaiKamera() {
        const video = document.getElementById('video');
        try {
            streamKamera = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = streamKamera;
        } catch (err) {
            alert("Akses kamera ditolak! Mohon izinkan penggunaan kamera di browser Anda.");
        }
    }

    function ambilFoto() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        base64String = canvas.toDataURL('image/jpeg', 0.7);
        
        preview.src = base64String;
        preview.style.display = 'block';
        document.getElementById('kamera-container').style.display = 'none';
        
        document.getElementById('btnJepret').style.display = 'none';
        document.getElementById('btnUlangi').style.display = 'block';
    }

    function ulangiFoto() {
        base64String = "";
        document.getElementById('preview').style.display = 'none';
        document.getElementById('kamera-container').style.display = 'block';
        document.getElementById('btnJepret').style.display = 'block';
        document.getElementById('btnUlangi').style.display = 'none';
    }

    function matikanKamera() {
        if (streamKamera) { streamKamera.getTracks().forEach(track => track.stop()); }
    }

    function showMsg(elId, text, type) {
        const el = document.getElementById(elId);
        el.style.display = "block";
        el.className = "msg msg-" + type;
        el.innerHTML = text;
    }

    function prosesLogin() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const btnLogin = document.getElementById("btnLogin");

        if (!email || !password) { showMsg("login-msg", "Mohon isi email dan password!", "error"); return; }

        btnLogin.disabled = true;
        showMsg("login-msg", "Memeriksa kredensial...", "warning");

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "login", email: email, password: password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.result === "success") {
                localStorage.setItem("guru_nama", data.nama);
                document.getElementById("nama-pegawai").innerText = data.nama;
                document.getElementById("panel-login").style.display = "none";
                document.getElementById("panel-absen").style.display = "block";
                document.getElementById("email").value = "";
                document.getElementById("password").value = "";
                document.getElementById("login-msg").style.display = "none";
                btnLogin.disabled = false;
                
                mulaiKamera(); 
            } else {
                showMsg("login-msg", data.message, "error"); btnLogin.disabled = false;
            }
        }).catch(err => { showMsg("login-msg", "Kesalahan jaringan.", "error"); btnLogin.disabled = false; });
    }

    function logout() {
        matikanKamera(); 
        localStorage.removeItem("guru_nama");
        document.getElementById("panel-absen").style.display = "none";
        document.getElementById("panel-login").style.display = "block";
        document.getElementById("absen-msg").style.display = "none";
        ulangiFoto(); 
    }

    function hitungJarakMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
    }

    function kirimAbsen() {
        const nama = localStorage.getItem("guru_nama"); 
        const status = document.getElementById('status').value;
        const btnAbsen = document.getElementById('btnAbsen');

        if (!nama) { alert("Sesi habis, silakan login ulang."); logout(); return; }
        if (!base64String) { alert('Silakan klik "Jepret Foto" terlebih dahulu!'); return; }

        btnAbsen.disabled = true;
        showMsg("absen-msg", "Mengecek lokasi GPS...", "warning");

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude; const lng = position.coords.longitude;
                    const jarak = hitungJarakMeters(SEKOLAH_LAT, SEKOLAH_LNG, lat, lng);
                    
                    if (jarak > RADIUS_MAKSIMAL) {
                        showMsg("absen-msg", `❌ <b>Ditolak!</b> Jarak Anda ${jarak}m.<br>(Batas Maksimal: ${RADIUS_MAKSIMAL}m)`, "error");
                        btnAbsen.disabled = false; return; 
                    }

                    showMsg("absen-msg", `Lokasi aman (${jarak}m). Mengirim data...`, "warning");

                    fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: "absen", nama: nama, status: status, lat: lat, lng: lng, fotoBase64: base64String
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.result === "success") {
                            showMsg("absen-msg", `✅ <b>Absen Berhasil!</b><br><span class="info-time">Info: <b>${data.infoWaktu}</b></span>`, "success");
                            ulangiFoto(); 
                            btnAbsen.disabled = false;
                        } else {
                            showMsg("absen-msg", "❌ Gagal: " + data.message, "error"); btnAbsen.disabled = false;
                        }
                    }).catch(err => { 
                        showMsg("absen-msg", "❌ <b>Koneksi terputus!</b><br>Data kemungkinan <b>sudah masuk</b>, tapi balasan server gagal dimuat. (" + err.message + ")", "error"); 
                        btnAbsen.disabled = false; 
                    });
                },
                function(error) { showMsg("absen-msg", "❌ Gagal akses GPS. Pastikan izin lokasi aktif.", "error"); btnAbsen.disabled = false; },
                { enableHighAccuracy: true }
            );
        } else {
            showMsg("absen-msg", "Browser tidak dukung GPS.", "error"); btnAbsen.disabled = false;
        }
    }
</script>

</body>
</html>
